[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iground"
version = "0.3.0"
description = "Move everything off iCloud (Drive, Photos, Messages, iPhone/WhatsApp backups) onto an external SSD."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = ["Operating System :: MacOS :: MacOS X", "Environment :: Console"]

[project.scripts]
iground = "iground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
